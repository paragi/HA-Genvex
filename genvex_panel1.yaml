type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Main Operation
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-entity-card
        entity: button.genvex_stop
        name: Emergency stop
        icon: mdi:fan-off
        icon_color: red
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.genvex_stop
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        name: Target supply air temperature (10-30°C)
        entity: number.genvex_target_temperature
        icon: mdi:thermometer-check
        icon_color: orange
        display_mode: slider
      - type: custom:mushroom-select-card
        entity: select.genvex_regulation_mode
        name: Regulation strategy
        icon: mdi:thermostat-cog
        icon_color: orange
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        name: Fan speed supply/exhaust (level 2)
        entity: number.genvex_fan_speed
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_fan_balance
        name: Fan balance (Supply -> exhaust)
        display_mode: slider
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        name: Frost prevention IMPORTANT! (1-10°C, 0=disable)
        entity: number.genvex_frost_reduction_temperature
        icon: mdi:snowflake-melt
        icon_color: white
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_frost_default_temperature
        name: After heater emergency stop temperature (0-10°C)
        display_mode: slider
        icon: mdi:snowflake-melt
        icon_color: white
      - type: custom:mushroom-entity-card
        entity: switch.genvex_frost_sw
        name: After heater frost protection
        icon_color: white
        tap_action:
          action: toggle
        display_mode: slider
      - type: custom:mushroom-entity-card
        entity: sensor.genvex_t8
        name: T8 After heater water temperature
        secondary: >-
          Measures the water temperature on the water-heating coil (if
          installed) to prevent freezing and bursting.
        icon: mdi:thermometer
        icon_color: white
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-entity-card
        entity: input_boolean.genvex_free_cooling_enabled
        name: Genvex Free Cooling (passive night cooling)
        secondary_info: >-
          Enables passive cooling using outdoor air when temp conditions are
          met.
        icon: mdi:snowflake-thermometer
        icon_color: blue
        tap_action:
          action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.genvex_free_cooling_enabled
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: input_number.genvex_fan_speed_free_cooling
          display_mode: slider
          name: Fan speed (increase when outdoor temp is low)
          icon: mdi:fan
          icon_color: light-blue
          primary_info: name
          secondary_info: state
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.genvex_free_cooling_enabled
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: input_number.genvex_stop_free_cooling_temp
          display_mode: slider
          name: Auto stop free cooling extract temp
          icon: mdi:fan
          icon_color: light-blue
          primary_info: name
          secondary_info: state
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        entity: number.genvex_filter_change_interval
        name: Filter change interval (1-6 months)
        display_mode: slider
        icon: mdi:calendar-clock
        icon_color: brown
      - type: custom:mushroom-entity-card
        entity: switch.genvex_filter_autostop_sw
        name: Auto stop on filter warning (+14 days)
        tap_action:
          action: toggle
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        name: Bypass heat exchange above set temp (1-10°C)
        entity: number.genvex_bypass_max_temperature
        icon_color: green
        icon: mdi:thermometer
        display_mode: slider
      - type: custom:mushroom-number-card
        name: Bypass min supply temp limit. 0 = Off (1-20°C)
        entity: number.genvex_end_bypass_low_fresh_air_limit
        icon_color: green
        icon: mdi:thermometer
        display_mode: slider
      - type: custom:mushroom-template-card
        primary: >-
          Bypass: {{ states('sensor.genvex_bypass_pct') }}% {{ '(On)' if
          is_state('sensor.genvex_bypass_on_off', '1') else '(Off)' }}
        icon: mdi:shuffle-variant
        icon_color: >-
          {{ 'blue' if is_state('sensor.genvex_bypass_on_off', '1') else 'green'
          }}
        entity: sensor.genvex_bypass_on_off
        tap_action:
          action: more-info
  - type: custom:mushroom-title-card
    title: Humidity control
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-entity-card
        entity: switch.genvex_humidity_sw
        name: Humidity control enable
        tap_action:
          action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.genvex_humidity_sw
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: number.genvex_humidity_max_value
          name: Humidity activation level
          icon: mdi:water-percent-alert
          display_mode: slider
      - type: conditional
        conditions:
          - condition: state
            entity: switch.genvex_humidity_sw
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: number.genvex_humidity_max_temperature
          name: Max Temp for humidity compensation (5-25°C)
          icon: mdi:thermometer
          display_mode: slider
      - type: conditional
        conditions:
          - condition: state
            entity: switch.genvex_humidity_sw
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: number.genvex_humidity_fan_speed_boost
          name: Humidity Fan Boost (5-30%)
          icon: mdi:fan-chevron-up
          secondary: Procent (5-30%) ventilationen øges ved høj fugt.
          display_mode: slider
      - type: conditional
        conditions:
          - condition: state
            entity: switch.genvex_humidity_sw
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: number.genvex_humidity_regulation_time
          name: Regulation interval (1-60 min)
          icon: mdi:timer-cog
  - type: custom:mushroom-title-card
    title: Fan control
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-number-card
        entity: number.genvex_level_1_supply
        name: Level 1 Supply air
        icon: mdi:fan-speed-1
        icon_color: blue
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_level_1_extract
        name: Level 1 Extract air
        icon: mdi:fan-speed-1
        icon_color: orange
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_level_2_supply
        name: Level 2 Supply air
        icon: mdi:fan-speed-2
        icon_color: blue
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_level_2_extract
        name: Level 2 Extract air
        icon: mdi:fan-speed-2
        icon_color: orange
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_level_3_supply
        name: Level 3 Supply air
        icon: mdi:fan-speed-3
        icon_color: blue
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_level_3_extract
        name: Level 3 Extract air
        icon: mdi:fan-speed-3
        icon_color: orange
        display_mode: slider
      - type: custom:mushroom-entity-card
        entity: switch.genvex_timer_level_3_4_sw
        name: Boost timeout enable (level 3-4) (Party mode)
        icon_color: pink
        tap_action:
          action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: switch.genvex_timer_level_3_4_sw
            state: "on"
        card:
          type: custom:mushroom-number-card
          entity: number.genvex_boost_timer_duration
          name: Boost time (level 3-4) before reset to level 2 (1-9 hours)
          icon: mdi:timer-outline
          icon_color: pink
  - type: custom:mushroom-title-card
    title: Mscellaneous
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-template-card
        entity: switch.genvex_reheat_sw
        primary: Reheating
        secondary: |
          {{ 'Active' if is_state(entity, 'on') else 'Inactive' }}
        icon: mdi:heating-coil
        icon_color: "{{ 'red' if is_state(entity, 'on') else 'disabled' }}"
        tap_action:
          action: toggle
      - type: custom:mushroom-number-card
        entity: number.genvex_water_regulation_interval
        name: After heater motor valve regulation time (1-250 sec.)
        icon: mdi:pipe-valve
        display_mode: slider
      - type: custom:mushroom-number-card
        entity: number.genvex_power_regulation_interval
        name: Electric pre-heater regulation time (1-300 sec.)
        icon: mdi:timer-cog
        icon_color: grey
        display_mode: slider
      - type: custom:mushroom-template-card
        entity: switch.genvex_aux_relay_r9_sw
        primary: Relay 9 Aux
        secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
        icon: >-
          {{ 'mdi:electric-switch-closed' if is_state(entity, 'on') else
          'mdi:electric-switch' }}
        icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
        tap_action:
          action: toggle
      - type: custom:mushroom-number-card
        entity: number.genvex_t2_temperature_adjustment
        name: T2 panel temp sensor calibration (-5 - 0°C)
        icon: mdi:tune-vertical
        display_mode: slider
