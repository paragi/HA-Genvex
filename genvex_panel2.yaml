  - type: custom:mushroom-title-card
    title: Software info
  - type: custom:mushroom-template-card
    primary: Genvex Controller
    secondary: >-
      ver. {{ states('sensor.genvex_ver_controller') }}{{
      states('sensor.genvex_subver_controller') }}
    icon: mdi:cpu-64-bit
    icon_color: green
  - type: custom:mushroom-template-card
    primary: Display Unit
    secondary: >-
      ver. {{ states('sensor.genvex_ver_display') }}{{
      states('sensor.genvex_subver_display') }}
    icon: mdi:monitor-dashboard
    icon_color: green
  - type: custom:mushroom-template-card
    primary: Modbus Protocol
    secondary: >-
      ver. {{ states('sensor.genvex_ver_modbus') }}{{
      states('sensor.genvex_subver_modbus') }}
    icon: mdi:lan-connect
    icon_color: green
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.genvex_modbus_mode
        primary: Modbus Mode
        secondary: >
          {% set mapper = { '0': 'OFF', '1': '9600', '2': '19200' } %} {% set
          state = states(entity) | int | string %} Value: {{ mapper[state] if
          state in mapper else 'Unknown' }} ({{ states(entity) }})
        icon: mdi:serial-port
        icon_color: green
        tap_action:
          action: none
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.genvex_modbus_address
        primary: Modbus Address (1-247)
        secondary: |
          ID: {{ states(entity) | int }}
        icon: mdi:identifier
        icon_color: green
        tap_action:
          action: none
