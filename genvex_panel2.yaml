  - type: custom:mushroom-title-card
    title: Digital Inputs & Outputs
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: binary_sensor.genvex_digital_in_1
        primary: Digital In 1
        secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
        icon: >-
          {{ 'mdi:arrow-left-bold-circle' if is_state(entity, 'on') else
          'mdi:arrow-left-bold-circle-outline' }}
        icon_color: "{{ 'green' if is_state(entity, 'on') else 'red' }}"
      - type: custom:mushroom-template-card
        entity: binary_sensor.genvex_digital_out_1
        primary: Digital Out 1
        secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
        icon: >-
